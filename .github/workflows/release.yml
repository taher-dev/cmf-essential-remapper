name: Release Publisher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/CMF-Essential-Remapper-${{ github.ref_name }}.apk
          cd release-assets
          sha256sum CMF-Essential-Remapper-${{ github.ref_name }}.apk > CMF-Essential-Remapper-${{ github.ref_name }}.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: CMF Essential Remapper ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

